import os
import sys
import lit.formats

# Import the module containing the custom in-process builtins.
# NB: These cannot be defined in the lit.cfg module.
sys.path.append(os.path.dirname(__file__))
import custom_inproc_builtins

config.name = "shtest-custom-inproc-builtins"
config.suffixes = [".txt"]
config.test_format = lit.formats.ShTest(
    extra_inproc_builtins={
        "returns_0": (custom_inproc_builtins.returns_0, False),
        "returns_1": (custom_inproc_builtins.returns_1, False),
        "custom_echo": (custom_inproc_builtins.custom_echo, False),
        "echo_to_stderr": (custom_inproc_builtins.echo_to_stderr, False),
    }
)
config.test_source_root = None
config.test_exec_root = None

